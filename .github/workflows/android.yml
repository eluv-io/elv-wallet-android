name: Android CI

on:
  push:
    branches: [ "main" ]
  # Enable manual non-main branch builds from Github
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create Secrets File
      run: |
        echo "
        MUX_ENV_KEY_MAIN=${{ secrets.MUX_ENV_KEY_MAIN }}
        MUX_ENV_KEY_DEMO=${{ secrets.MUX_ENV_KEY_DEMO }}
        " > secrets/secrets.properties

    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > ${{ github.workspace }}/keystore.jks

    - name: Decode tv google-services.json
      run: echo "${{ secrets.GOOGLE_SERVICES_JSON_TV_B64 }}" | base64 --decode > ${{ github.workspace }}/tv/google-services.json

    - name: Decode mobile google-services.json
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_MOBILE_B64 }}" ]; then
          echo "${{ secrets.GOOGLE_SERVICES_JSON_MOBILE_B64 }}" | base64 --decode > ${{ github.workspace }}/mobile/google-services.json
        else
          echo "GOOGLE_SERVICES_JSON_MOBILE_B64 not set; Firebase will be disabled in mobile build"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: |
        ./gradlew :tv:assembleDebug :tv:assembleRelease :mobile:assembleDebug :mobile:assembleRelease \
          -Pci_build_number=${{ github.run_number }} \
          -Pandroid.injected.signing.store.file='${{ github.workspace }}/keystore.jks' \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEYSTORE_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

    - name: Save version info
      run: |
        sha=$(git rev-parse --short ${{ github.sha }})
        tv_version=$(./gradlew -q :tv:printVersion -Pci_build_number=${{ github.run_number }})
        echo "TV_APK_VERSION=$tv_version-$sha" >> $GITHUB_ENV

    # TV APKs are uploaded as GitHub Actions artifacts (downloadable from the run's
    # Summary page). Mobile APKs are not — they go to Firebase App Distribution below.
    - name: Rename APKs
      run: |
        mv tv/build/outputs/apk/debug/tv-debug.apk media-wallet-debug-${{ env.TV_APK_VERSION }}.apk
        mv tv/build/outputs/apk/release/tv-release.apk media-wallet-release-${{ env.TV_APK_VERSION }}.apk

    - name: Upload TV APKs
      uses: actions/upload-artifact@v4
      with:
        name: TV APKs (${{ env.TV_APK_VERSION }})
        path: media-wallet-*.apk

    # Mobile APKs are distributed to testers via Firebase App Distribution
    # (Firebase console -> App Distribution, project elv-mobile-wallet).
    - name: Distribute Mobile APKs via Firebase App Distribution
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
      run: |
        if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}" ] || [ ! -f mobile/google-services.json ]; then
          echo "Firebase credentials not configured; skipping mobile distribution"
          exit 0
        fi
        echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}" | base64 --decode > "$GOOGLE_APPLICATION_CREDENTIALS"
        notes="$(git log -1 --format='%h %s' ${{ github.sha }})"
        ./gradlew :mobile:appDistributionUploadDebug --releaseNotes="$notes" --groups="eluvio-internal" \
                  :mobile:appDistributionUploadRelease --releaseNotes="$notes" --groups="eluvio-internal" \
          -Pci_build_number=${{ github.run_number }}
